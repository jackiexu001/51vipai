        <h1>美股新手第一课：先看懂指数、公司和 ETF</h1>
        <p>这是一篇示范文章。以后你可以把这里替换成自己的正文。</p>
      </header>
      <article class="article-body">
        <p>刚开始接触美股时，不要一上来就问买哪只股票。更好的顺序是先看懂市场结构。</p>
        <h2>第一步：看指数</h2>
        <p>指数可以帮你理解市场整体状态。常见指数包括标普 500、纳斯达克 100 和道琼斯指数。</p>
        <h2>第二步：看公司</h2>
        <p>公司研究可以从业务、收入、利润、现金流、估值和风险几个角度开始。</p>
        <h2>第三步：看 ETF</h2>
        <p>ETF 是一篮子资产。对新手来说，ETF 往往比单只股票更容易作为学习入口。</p>
      </article>

        <h1>加密货币入门：先理解资产、钱包和交易所</h1>
        <p>这是一篇示范文章，用来展示加密货币分类下的文章详情页。</p>
      </header>
      <article class="article-body">
        <p>加密货币学习的第一步不是预测价格，而是理解资产如何保存和转移。</p>
        <h2>资产</h2>
        <p>比特币、以太坊、稳定币等资产有不同的用途、风险和市场逻辑。</p>
        <h2>钱包</h2>
        <p>钱包用于管理地址和私钥。助记词是资产安全的核心，不应该随意截图或发送给别人。</p>
        <h2>交易所</h2>
        <p>交易所方便买卖资产，但也带来托管风险和平台风险。</p>
